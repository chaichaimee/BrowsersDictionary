summary = "BrowserDictionary"
description = """Browsers Dictionary を使用して、ウェブサイトごとに NVDA の読み上げをカスタマイズします。リアルタイムの URL トラッキング、ページまたはドメインごとのテキストおよび正規表現の置換、JSON ファイルのインポート、正規表現の安全性保護機能を備えています。音声読み上げをリアルタイムで自動的に置換し、正確でスムーズなウェブ閲覧を実現します。

ショートカットキー:
NVDA+Shift+W
1回押す : Browsers Dictionary の設定を開く
2回押す : 新しいサイトを追加"""