summary = "Dictionnaire pour navigateurs"
description = """Personnalisez la voix de NVDA pour chaque site web grâce au dictionnaire pour navigateurs. Comprend le suivi des URL en direct, des remplacements de texte et d'expressions régulières par page ou domaine, l'importation de fichiers JSON et des protections de sécurité pour les expressions régulières. Substitue automatiquement le texte prononcé en temps réel pour offrir une lecture web précise et fluide.

Touche de raccourci :
ALT+Windows+B
Un simple appui : Ouvrir les paramètres du dictionnaire pour navigateurs
Un double appui : Ajouter un nouveau site
Un triple appui : Modifier le site"""