summary = "Dictionnaire pour navigateur"
description = """Personnalisez la synthèse vocale de NVDA pour chaque site web avec le dictionnaire pour navigateurs. Comprend le suivi des URL en direct, des remplacements de texte et d'expressions régulières par page ou par domaine, l'importation de fichiers JSON et des protections de sécurité pour les expressions régulières. Substitue automatiquement le texte prononcé en temps réel pour offrir une lecture Web précise et fluide.

Touche de raccourci :
ALT+Windows+B
Une seule touche : Ouvrir les paramètres du dictionnaire pour navigateurs
Double touche : Ajouter un nouveau site
Triple touche : Modifier le site"""