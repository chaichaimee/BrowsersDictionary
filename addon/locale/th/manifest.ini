summary = "พจนานุกรมเบราว์เซอร์"
description = """ปรับแต่งเสียงพูดของ NVDA ตามเว็บไซต์ด้วยพจนานุกรมเบราว์เซอร์ มาพร้อมกับการติดตาม URL แบบสด การแทนที่ข้อความและเรกเซ็กซ์ (Regex) ตามหน้าหรือโดเมน การนำเข้าไฟล์ JSON และระบบป้องกันความปลอดภัยของเรกเซ็กซ์ แทนที่ข้อความที่พูดแบบเรียลไทม์โดยอัตโนมัติเพื่อให้การอ่านเว็บมีความแม่นยำและราบรื่น

คีย์ลัด:
ALT+Windows+B
แตะครั้งเดียว: เปิดการตั้งค่าพจนานุกรมเบราว์เซอร์
แตะสองครั้ง: เพิ่มเว็บไซต์ใหม่
แตะสามครั้ง: แก้ไขเว็บไซต์"""