summary = "BrowserDictionary"
description = """ปรับแต่งการอ่านออกเสียงของ NVDA แยกตามเว็บไซต์ด้วย Browsers Dictionary มาพร้อมระบบติดตาม URL แบบเรียลไทม์, การแทนที่ข้อความและ regex แยกตามหน้าหรือโดเมน, การนำเข้าไฟล์ JSON และระบบคำนึงถึงความปลอดภัยของ regex โดยจะแทนที่ข้อความที่อ่านออกเสียงโดยอัตโนมัติแบบเรียลไทม์ เพื่อให้การอ่านเว็บแม่นยำและราบรื่น

คีย์ลัด:
NVDA+Shift+W
กดหนึ่งครั้ง : เปิดการตั้งค่า Browsers Dictionary
กดสองครั้ง : เพิ่มเว็บไซต์ใหม่"""