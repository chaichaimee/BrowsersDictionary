summary = "พจนานุกรมเบราว์เซอร์"
description = """ปรับแต่งเสียงพูดของ NVDA แยกตามเว็บไซต์ด้วย Browsers Dictionary มีฟีเจอร์ติดตาม URL แบบสด, การแทนที่ข้อความและนิพจน์ทั่วไป (Regex) ตามหน้าหรือโดเมน, การนำเข้าไฟล์ JSON และระบบป้องกันความปลอดภัยของ Regex ทำหน้าที่แทนที่ข้อความที่อ่านออกเสียงแบบเรียลไทม์โดยอัตโนมัติ เพื่อการอ่านเว็บที่แม่นยำและราบรื่น

ปุ่มล
ALT+Windows+B
แตะครั้งเดียว: เปิดการตั้งค่าพจนานุกรมของเบราว์เซอร์
แตะสองครั้ง: เพิ่มเว็บไซต์ใหม่
แตะสามครั้ง: แก้ไขเว็บไซต์"""