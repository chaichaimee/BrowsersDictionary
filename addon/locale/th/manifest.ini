summary = "เบราว์เซอร์ดิกชันนารี"
description = """ปรับแต่งเสียงพูดของ NVDA ตามเว็บไซต์ด้วย Browsers Dictionary มีฟีเจอร์ติดตาม URL แบบสด, การแทนที่ข้อความและนิพจน์ทั่วไป (Regex) ตามหน้าหรือโดเมน, การนำเข้าไฟล์ JSON และระบบป้องกันความปลอดภัยของ Regex แทนที่ข้อความที่พูดแบบเรียลไทม์โดยอัตโนมัติเพื่อให้การอ่านเว็บเป็นไปอย่างแม่นยำและราบรื่น

คีย์ลัด:
ALT+Windows+B
แตะครั้งเดียว: เปิดการตั้งค่า Browsers Dictionary
แตะสองครั้ง: เพิ่มเว็บไซต์ใหม่
แตะสามครั้ง: แก้ไขเว็บไซต์"""