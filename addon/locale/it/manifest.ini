summary = "پاتوق‌خوان مرورگر"
description = """شخصی‌سازی گفتار ان‌وی‌دی‌ای برای هر وب‌سایت با پاتوق‌خوان مرورگر. دارای ردیابی زنده نشانی وب، جایگزینی متن و عبارت منظم (regex) بر اساس صفحه یا دامنه، وارد کردن پرونده JSON و محافظت‌های ایمنی عبارت منظم. متن گفته‌شده را به‌طور خودکار و در زمان واقعی جایگزین می‌کند تا خواندن وب دقیق و بی‌نقص ارائه شود.

کلید میان‌بر:
ALT+Windows+B
تک ضربه: باز کردن تنظیمات پاتوق‌خوان مرورگر
دو ضربه: افزودن سایت جدید
سه ضربه: ویرایش سایت"""