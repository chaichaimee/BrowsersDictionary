summary = "دکشنری مرورگر"
description = """گفتار NVDA را برای هر وب‌سایت با دکشنری مرورگر سفارشی‌سازی کنید. دارای ردیابی زنده URL، جایگزینی متن و عبارت منظم (regex) بر اساس صفحه یا دامنه، وارد کردن فایل JSON و محافظت‌های ایمنی عبارت منظم. به طور خودکار متن گفته‌شده را در زمان واقعی جایگزین می‌کند تا خواندن وب را دقیق و یکپارچه ارائه دهد.

کلید میانبر:
ALT+Windows+B
ضربه تکی: باز کردن تنظیمات دکشنری مرورگر
ضربه دوگانه: افزودن سایت جدید
ضربه سه گانه: ویرایش سایت"""