summary = "Словник для браузера"
description = """Налаштовуйте мовлення NVDA для кожного вебсайту за допомогою «Словника для браузера». Має відстеження URL-адрес у реальному часі, заміну тексту та регулярних виразів за сторінкою або доменом, імпорт файлів JSON і захист регулярних виразів. Автоматично замінює озвучений текст у реальному часі для точного та плавного читання вебсторінок.

Гаряча клавіша:
ALT+Windows+B
Одинарний тап: Відкрити налаштування Словника для браузера
Подвійний тап: Додати новий сайт
Потрійний тап: Редагувати сайт"""