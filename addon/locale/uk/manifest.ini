summary = "BrowserDictionary"
description = """Налаштування мовлення NVDA для кожного вебсайту за допомогою Browsers Dictionary. Включає відстеження URL у реальному часі, заміну тексту та регулярних виразів за сторінками або доменами, імпорт файлів JSON та захист безпеки регулярних виразів. Автоматично замінює озвучуваний текст у реальному часі для точного та безперервного читання вебсторінок.

Гаряча клавіша:
NVDA+Shift+W
Одиночне натискання : Відкрити налаштування Browsers Dictionary
Подвійне натискання : Додати новий сайт"""