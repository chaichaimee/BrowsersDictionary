summary = "Словник для браузера"
description = """Налаштовуйте мовлення NVDA для кожного вебсайту за допомогою Словника для браузерів. Має функцію відстеження URL-адрес у реальному часі, заміну тексту та регулярних виразів для сторінки чи домена, імпорт файлів JSON і захист регулярними виразами. Автоматично замінює вимовлений текст у реальному часі для точного та плавного читання вебсторінок.

Гаряча клавіша:
ALT+Windows+B
Одинарне торкання: Відкрити налаштування Словника для браузерів
Подвійне торкання: Додати новий сайт
Потрійне торкання: Редагувати сайт"""