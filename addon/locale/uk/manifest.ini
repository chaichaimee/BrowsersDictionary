summary = "Словник браузера"
description = """Налаштовуйте мовлення NVDA для кожного вебсайту за допомогою словника браузерів. Функції включають відстеження URL-адрес у реальному часі, заміну тексту та регулярних виразів для сторінок або доменів, імпорт JSON-файлів та захист регулярних виразів. Автоматично замінює озвучуваний текст у реальному часі для забезпечення точного та плавного читання вебсторінок.

Гаряча клавіша:
ALT+Windows+B
Одинарний тап: Відкрити налаштування словника браузерів
Подвійний тап: Додати новий сайт
Потрійне натискання Tab: редагувати сайт"""