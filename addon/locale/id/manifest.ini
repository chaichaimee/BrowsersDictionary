summary = "Kamus Peramban"
description = """Sesuaikan ucapan NVDA per situs web dengan Kamus Peramban. Dilengkapi pelacakan URL langsung, penggantian teks dan regex berdasarkan halaman atau domain, impor file JSON, dan perlindungan keamanan regex. Secara otomatis mengganti teks yang diucapkan secara real-time untuk menghasilkan pembacaan web yang akurat dan mulus.

Tombol Pintas:
ALT+Windows+B
Ketuk Sekali: Buka pengaturan Kamus Peramban
Ketuk Dua Kali: Tambah situs baru
Ketuk Tiga Kali: Edit situs"""