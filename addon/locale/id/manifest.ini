summary = "BrowserDictionary"
description = """Sesuaikan ucapan NVDA per situs web dengan Browsers Dictionary. Dilengkapi pelacakan URL langsung, penggantian teks dan regex berdasarkan halaman atau domain, impor berkas JSON, serta perlindungan keamanan regex. Secara otomatis mengganti teks yang diucapkan secara real-time untuk memberikan pembacaan web yang akurat dan lancar.

Tombol Pintas:
NVDA+Shift+W
Tekan Sekali : Buka pengaturan Browsers Dictionary
Tekan Dua Kali : Tambah situs baru"""