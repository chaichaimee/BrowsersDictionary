summary = "Diccionario del navegador"
description = """Personaliza la voz de NVDA por sitio web con el diccionario de navegadores. Cuenta con seguimiento de URL en vivo, reemplazos de texto y expresiones regulares por página o dominio, importación de archivos JSON y protecciones de seguridad para expresiones regulares. Sustituye automáticamente el texto hablado en tiempo real para ofrecer una lectura web precisa y fluida.

Tecla rápida:
ALT+Windows+B
Un toque: Abrir la configuración del diccionario de navegadores
Doble toque: Agregar nuevo sitio
Triple toque: Editar sitio"""