summary = "Diccionario de navegador"
description = """Personaliza la voz de NVDA por sitio web con Browsers Dictionary. Ofrece seguimiento de URL en directo, reemplazos de texto y expresiones regulares por página o dominio, importación de archivos JSON y protecciones de seguridad para expresiones regulares. Sustituye automáticamente el texto hablado en tiempo real para ofrecer una lectura web precisa y fluida.

Método abreviado:
ALT+Windows+B
Un solo toque : Abrir la configuración del diccionario de navegadores
Doble toque: Añadir nuevo sitio
Triple Tab: editar sitio"""