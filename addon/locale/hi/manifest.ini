summary = "ब्राउज़र डिक्शनरी"
description = """ब्राउज़र्स डिक्शनरी के साथ प्रत्येक वेबसाइट के लिए NVDA स्पीच को कस्टमाइज़ करें। इसमें लाइव URL ट्रैकिंग, पेज या डोमेन द्वारा टेक्स्ट और रेगेक्स रिप्लेसमेंट, JSON फ़ाइल आयात, और रेगेक्स सुरक्षा सुरक्षाएँ शामिल हैं। सटीक और निर्बाध वेब रीडिंग प्रदान करने के लिए वास्तविक समय में बोले गए टेक्स्ट को स्वचालित रूप से बदलता है।

हॉट कुंजी:
ALT+Windows+B
सिंगल टैप: ब्राउज़र्स डिक्शनरी सेटिंग्स खोलें
डबल टैप: नई साइट जोड़ें
ट्रिपल टैप: साइट संपादित करें"""