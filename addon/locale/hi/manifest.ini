summary = "ब्राउज़र डिक्शनरी"
description = """ब्राउज़र डिक्शनरी के साथ प्रत्येक वेबसाइट के लिए NVDA स्पीच को अनुकूलित करें। इसमें लाइव यूआरएल ट्रैकिंग, पेज या डोमेन द्वारा टेक्स्ट और रेगुलर एक्सप्रेशन (रेगेक्स) प्रतिस्थापन, JSON फ़ाइल आयात, और रेगेक्स सुरक्षा सुरक्षा शामिल हैं। सटीक और सहज वेब रीडिंग प्रदान करने के लिए वास्तविक समय में बोले जाने वाले टेक्स्ट को स्वचालित रूप से बदलता है।

हॉटकी:
ALT+Windows+B
सिंगल टैप: ब्राउज़र डिक्शनरी सेटिंग्स खोलें
डबल टैप: नई साइट जोड़ें
ट्रिपल टैप: साइट संपादित करें"""