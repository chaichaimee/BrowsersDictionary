summary = "ब्राउज़र डिक्शनरी"
description = """ब्राउज़र डिक्शनरी के साथ प्रत्येक वेबसाइट के लिए NVDA स्पीच को कस्टमाइज़ करें। इसमें लाइव URL ट्रैकिंग, पेज या डोमेन द्वारा टेक्स्ट और रेगेक्स (regex) रिप्लेसमेंट, JSON फ़ाइल इम्पोर्ट और रेगेक्स सुरक्षा सुरक्षाएं शामिल हैं। सटीक और सहज वेब रीडिंग प्रदान करने के लिए यह वास्तविक समय में बोले जाने वाले टेक्स्ट को स्वचालित रूप से बदल देता है।

हॉटकी:
ALT+Windows+B
सिंगल टैप: ब्राउज़र डिक्शनरी सेटिंग खोलें
डबल टैप: नई साइट जोड़ें
ट्रिपल टैप: साइट संपादित करें"""