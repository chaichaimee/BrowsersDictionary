summary = "BrowserDictionary"
description = """Browsers Dictionary के साथ प्रति वेबसाइट NVDA वाणी को अनुकूलित करें। इसमें लाइव URL ट्रैकिंग, पेज या डोमेन द्वारा टेक्स्ट और regex प्रतिस्थापन, JSON फ़ाइल आयात, और regex सुरक्षा सुरक्षाएं शामिल हैं। सटीक, निर्बाध वेब पठन प्रदान करने के लिए वास्तविक समय में बोले गए पाठ को स्वचालित रूप से बदल देता है।

हॉट की:
NVDA+Shift+W
एक बार दबाएं : Browsers Dictionary सेटिंग्स खोलें
दो बार दबाएं : नया साइट जोड़ें"""