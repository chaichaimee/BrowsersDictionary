summary = "Словарь браузера"
description = """Настройка речи NVDA для каждого сайта с помощью словаря браузеров. Поддерживает отслеживание URL в реальном времени, замену текста и регулярных выражений для страниц или доменов, импорт файлов JSON и защиту от опасных регулярных выражений. Автоматически заменяет произносимый текст в реальном времени для точного и бесшовного чтения веб-страниц.

Горячая клавиша:
ALT+Windows+B
Одиночное касание: Открыть настройки словаря браузеров
Двойное касание: добавить новый сайт
Тройное нажатие: править сайт"""