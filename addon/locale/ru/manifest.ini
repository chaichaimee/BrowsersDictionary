summary = "BrowserDictionary"
description = """Настройка речи NVDA для каждого веб-сайта с помощью Browsers Dictionary. Включает отслеживание URL в реальном времени, замену текста и регулярных выражений по страницам или доменам, импорт JSON-файлов и защиту безопасности регулярных выражений. Автоматически заменяет произносимый текст в реальном времени для точного и плавного чтения веб-страниц.

Горячая клавиша:
NVDA+Shift+W
Одиночное нажатие : Открыть настройки Browsers Dictionary
Двойное нажатие : Добавить новый сайт"""