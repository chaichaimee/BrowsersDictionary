summary = "Словарь для браузера"
description = """Настройка речи NVDA для каждого сайта с помощью словаря браузеров. Поддерживает отслеживание URL в реальном времени, замену текста и регулярных выражений для страницы или домена, импорт JSON-файлов и защиту от небезопасных регулярных выражений. Автоматически подменяет произносимый текст в реальном времени для точного и плавного чтения веб-страниц.

Горячая клавиша:
ALT+Windows+B
Одиночное касание: открыть настройки словаря браузеров
Двойное касание: добавить новый сайт
Тройное касание: редактировать сайт"""