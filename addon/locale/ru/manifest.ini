summary = "Словарь браузера"
description = """Настройте речь NVDA для каждого веб-сайта с помощью словаря браузеров. Функции включают отслеживание URL в реальном времени, замену текста и регулярных выражений для страницы или домена, импорт JSON-файлов и защиту регулярных выражений. Автоматически заменяет произносимый текст в реальном времени для обеспечения точного и плавного чтения веб-страниц.

Горячая клавиша:
ALT+Windows+B
Одиночное касание: открыть настройки словаря браузеров
Двойное касание: добавить новый сайт
Тройное касание: изменить сайт"""