summary = "قاموس المتصفح"
description = """تخصيص كلام NVDA لكل موقع إلكتروني باستخدام قاموس المتصفح. يتضمن تتبعاً مباشراً لعناوين الرابط، واستبدالات للنصوص والتعبيرات المنتظمة حسب الصفحة أو النطاق، واستيراد ملفات JSON، وحماية أمان التعبيرات المنتظمة. يقوم تلقائياً باستبدال النص المنطوق في الوقت الفعلي لتوفير قراءة دقيقة وسلسة للويب.

مفتاح الاختصار:
ALT+Windows+B
نقرة واحدة: فتح إعدادات قاموس المتصفح
نقرة مزدوجة: إضافة موقع جديد
ثلاث نقرات: تحرير الموقع"""