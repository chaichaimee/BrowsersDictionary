summary = "قاموس المتصفح"
description = """تخصيص نطق NVDA لكل موقع إلكتروني باستخدام قاموس المتصفحات. يتضمن تتبعا مباشرا لعناوين URL، واستبدال النصوص والتعبيرات النمطية حسب الصفحة أو النطاق، واستيراد ملفات JSON، وحماية أمان التعبيرات النمطية. يستبدل النص المنطوق تلقائيا في الوقت الفعلي لتوفير قراءة ويب دقيقة وسلسة.

مفتاح الاختصار:
ALT+Windows+B
نقرة واحدة: فتح إعدادات قاموس المتصفحات
نقرة مزدوجة: إضافة موقع جديد
ثلاث نقرات: تحرير الموقع"""