summary = "قاموس المتصفح"
description = """تخصيص نطق NVDA لكل موقع إلكتروني باستخدام قاموس المتصفحات. يتضمن تتبعا مباشرا لعناوين الفهرس، واستبدالات للنصوص والتعابير النمطية حسب الصفحة أو النطاق، واستيراد ملفات JSON، وحماية أمان التعابير النمطية. يستبدل النص المنطوق تلقائيا في الوقت الفعلي لتقديم قراءة ويب دقيقة وسلسة.

مفتاح الاختصار:
ALT+Windows+B
نقرة واحدة: فتح إعدادات قاموس المتصفحات
نقرة مزدوجة: إضافة موقع جديد
ثلاث نقرات: تحرير الموقع"""