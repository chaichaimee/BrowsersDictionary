summary = "BrowserDictionary"
description = """تخصيص نطق NVDA لكل موقع ويب باستخدام Browsers Dictionary. يتميز بتتبع الرابط المباشر، واستبدال النصوص والتعبيرات النمطية (regex) حسب الصفحة أو النطاق، واستيراد ملفات JSON، وحماية أمان التعبيرات النمطية. يستبدل النص المنطوق تلقائيًا في الوقت الفعلي لتوفير قراءة ويب دقيقة وسلسة.

اختصار الكيبورد:
NVDA+Shift+W
ضغطة واحدة : فتح إعدادات Browsers Dictionary
ضغطة مزدوجة : إضافة موقع جديد"""