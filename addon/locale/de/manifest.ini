summary = "BrowserDictionary"
description = """Passen Sie die NVDA-Sprache für jede Website mit BrowserDictionary an. Bietet Live-URL-Verfolgung, Text- und Regex-Ersetzungen nach Seite oder Domain, JSON-Dateimport und Regex-Sicherheitsschutz. Ersetzt automatisch gesprochenes Material in Echtzeit für ein präzises und nahtloses Web-Lesen.

Tastenkombination:
ALT+Windows+B
Einfach tippen: BrowserDictionary-Einstellungen öffnen
Doppelt tippen: Neue Website hinzufügen
Dreifach tippen: Website bearbeiten"""