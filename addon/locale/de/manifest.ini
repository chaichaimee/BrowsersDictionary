summary = "Browser-Wörterbuch"
description = """Passen Sie die NVDA-Sprachausgabe für jede Website mit dem Browser-Wörterbuch an. Bietet Live-URL-Verfolgung, Text- und RegEx-Ersetzungen nach Seite oder Domain, JSON-Dateiimport und RegEx-Sicherheitsschutz. Ersetzt automatisch gesprochenes Textmaterial in Echtzeit für ein präzises und nahtloses Web-Lesen.

Tastenkombination:
ALT+Windows+B
Einfachtippen: Browser-Wörterbuch-Einstellungen öffnen
Doppeltippen: Neue Website hinzufügen
Dreifachtippen: Website bearbeiten"""