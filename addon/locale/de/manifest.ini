summary = "BrowserDictionary"
description = """Passen Sie die NVDA-Sprachausgabe pro Website mit Browsers Dictionary an. Bietet Live-URL-Verfolgung, Text- und Regex-Ersetzungen nach Seite oder Domain, JSON-Datei-Import und Regex-Sicherheitskontrollen. Ersetzt gesprochenen Text automatisch in Echtzeit für ein genaues und nahtloses Web-Leseerlebnis.

Tastenkombination:
NVDA+Umschalt+W
Einmal drücken : Browsers Dictionary-Einstellungen öffnen
Zweimal drücken : Neue Website hinzufügen"""