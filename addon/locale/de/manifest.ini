summary = "BrowserDictionary"
description = """NVDA-Sprache für Websites mit dem Browser-Wörterbuch anpassen. Bietet Live-URL-Verfolgung, Text- und RegEx-Ersetzungen nach Seite oder Domain, JSON-Dateiimport sowie RegEx-Sicherheitsvorkehrungen. Ersetzt gesprochenen Text automatisch in Echtzeit für ein präzises und nahtloses Web-Leseerlebnis.

Tastenkombination:
ALT+Windows+B
Einfach-Tippen: Browsers Dictionary-Einstellungen öffnen
Doppelt-Tippen: Neue Website hinzufügen
Dreifach-Tippen: Website bearbeiten"""